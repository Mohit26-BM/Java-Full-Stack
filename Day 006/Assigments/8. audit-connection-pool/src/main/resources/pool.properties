# =========================================================
# Connection pool settings (HikariCP).
# Change these without touching any Java code.
# =========================================================

# Name shown in log messages
pool.name=AuditPool

# At most 5 physical connections to MySQL, shared by all threads.
pool.maximumPoolSize=5

# Keep all 5 ready (fixed-size pool).
pool.minimumIdle=5

# How long a thread WAITS for a free connection before giving up.
# Short (3 s) so pool exhaustion is visible quickly in the demo.
# Production services often use 10-30 s.
pool.connectionTimeoutMs=3000

# Close connections idle longer than 10 minutes (only above minimumIdle).
pool.idleTimeoutMs=600000

# Replace every connection after 30 minutes (below MySQL's wait_timeout).
pool.maxLifetimeMs=1800000

# Log a WARNING if a connection is borrowed for more than 10 s
# without being returned (helps find connection leaks).
pool.leakDetectionThresholdMs=10000
