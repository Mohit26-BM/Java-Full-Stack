# HikariCP connection pool settings.
pool.name=WalletPool
pool.maximumPoolSize=5
pool.minimumIdle=5
# Max wait for a free connection before a clear error (ms)
pool.connectionTimeoutMs=5000
pool.idleTimeoutMs=600000
pool.maxLifetimeMs=1800000
# Warn if a connection is held longer than this (leak detection)
pool.leakDetectionThresholdMs=15000
