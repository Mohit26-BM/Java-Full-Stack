# =========================================================
# Spring Boot configuration. Boot reads this file automatically.
# There is NO Java code that creates a server, DataSource or JdbcTemplate.
# =========================================================

spring.application.name=boot-autoconfig-demo

# Embedded Tomcat port (8080 is the default; written here only to show it).
server.port=8080

# ---------------------------------------------------------
# DataSource auto-configuration: because spring-boot-starter-jdbc and the
# MySQL driver are on the classpath, Boot builds a HikariCP DataSource and a
# JdbcTemplate from these three properties.
# Shared Day 07 database. The password lives in db-secret.properties
# (git-ignored) and is imported below.
# ---------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/Day_007_Assigments
spring.datasource.username=root
spring.config.import=optional:classpath:db-secret.properties

# ---------------------------------------------------------
# OPTIONAL EXTENSION - Actuator.
# Only /actuator/health is exposed over HTTP by default; expose a few more.
# (Never expose everything on a public production server.)
# ---------------------------------------------------------
management.endpoints.web.exposure.include=health,info,beans,mappings,conditions,metrics,env
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Spring Boot Auto-Configuration Demo
info.app.assignment=Day 07 - Assignment 07
