# =========================================================
# Common / fallback configuration - ALWAYS loaded.
# application-{profile}.properties is loaded on top of it and
# overrides only the keys it contains.
# =========================================================

spring.application.name=spring-profiles-demo
server.port=8080

app.message=Hello! No profile is active - using application.properties defaults.
app.environment=none
app.show-sql-logs=false
app.cache-ttl-seconds=60

# The profile is NOT fixed here, so it can be chosen at run time.
# (Uncommenting this would make "dev" the profile when nothing else is given.)
# spring.profiles.active=dev
