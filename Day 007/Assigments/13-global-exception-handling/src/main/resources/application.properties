spring.application.name=global-exception-handling
server.port=8080

# Shared Day 07 database (table a13_accounts). Password: db-secret.properties (git-ignored)
spring.datasource.url=jdbc:mysql://localhost:3306/Day_007_Assigments
spring.datasource.username=root
spring.config.import=optional:classpath:db-secret.properties

# Defence in depth: even Boot's own fallback error page never shows a stack trace
# ("never" is Boot's default - written here to make the intent explicit).
server.error.include-stacktrace=never
server.error.include-exception=false
