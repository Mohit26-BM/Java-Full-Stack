spring.application.name=jpa-one-to-many
server.port=8080

# Shared Day 07 database (tables a15_departments, a15_employees). Password: db-secret.properties (git-ignored)
spring.datasource.url=jdbc:mysql://localhost:3306/Day_007_Assigments
spring.datasource.username=root
spring.config.import=optional:classpath:db-secret.properties

# Hibernate only CHECKS the tables (they come from schema.sql)
spring.jpa.hibernate.ddl-auto=validate

# The session closes when the service method returns, so LAZY data must be
# loaded inside the service (that is what the DTO mapping does).
spring.jpa.open-in-view=false

# Show the generated SQL and bound values
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
