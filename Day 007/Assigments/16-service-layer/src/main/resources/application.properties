spring.application.name=service-layer
server.port=8080

# Shared Day 07 database (tables a16_products, a16_orders). Password: db-secret.properties (git-ignored)
spring.datasource.url=jdbc:mysql://localhost:3306/Day_007_Assigments
spring.datasource.username=root
spring.config.import=optional:classpath:db-secret.properties

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Show the request flow: CONTROLLER -> SERVICE -> repository (Hibernate SQL)
logging.level.org.hibernate.SQL=DEBUG
# shorter log lines: time, logger name (= layer), message
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %-14logger{0} : %msg%n
