spring.application.name=transactions
server.port=8080

# Shared Day 07 database (table a17_accounts). Password: db-secret.properties (git-ignored)
spring.datasource.url=jdbc:mysql://localhost:3306/Day_007_Assigments
spring.datasource.username=root
spring.config.import=optional:classpath:db-secret.properties

spring.jpa.hibernate.ddl-auto=validate
# No session/transaction held open across the web request - only the service decides
spring.jpa.open-in-view=false

# ---- Make transactions VISIBLE in the console ----
# "Creating new transaction ...", "Committing ...", "Rolling back ..."
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
# the UPDATE statements actually sent
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %-21logger{0} : %msg%n
