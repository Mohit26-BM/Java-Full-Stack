spring.application.name=hospital-management
server.port=8080

# ---------------- Database ----------------
# Day 09 uses its own database, so the Day 08 database (hospital_management) is not touched.
# createDatabaseIfNotExist: the first start creates the empty database, then Flyway fills it.
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_day09?createDatabaseIfNotExist=true
spring.datasource.username=root
# The password is kept in db-secret.properties (git-ignored)
spring.config.import=optional:classpath:db-secret.properties

# ---------------- Flyway (database migrations) ----------------
# At startup Flyway runs every migration that has not run yet, in version order:
#   db/migration : V1 tables, V2 working hours + leave, V3 status-change audit
#   db/sample    : V1_1 assignment sample data, V3_1 sample working hours
# and records each one in the table flyway_schema_history.
spring.flyway.locations=classpath:db/migration,classpath:db/sample

# ---------------- JPA / Hibernate ----------------
# Flyway creates and changes the tables. Hibernate only CHECKS that the
# entities match them and never changes the database.
spring.jpa.hibernate.ddl-auto=validate

# Lazy data must be loaded inside the service transaction, not while the
# JSON response is being written.
spring.jpa.open-in-view=false

# Show every SQL statement Hibernate sends to MySQL
logging.level.org.hibernate.SQL=DEBUG

# ---------------- Dates and times in URL parameters ----------------
# ?date=2026-10-20 and ?startTime=10:00 are read in ISO format
spring.mvc.format.date=iso
spring.mvc.format.time=iso

# ---------------- Pagination ----------------
# A client can ask for at most 50 rows per page
spring.data.web.pageable.max-page-size=50

# ---------------- Extension: missed-appointment (NO_SHOW) job ----------------
# Every hour at minute 15, appointments still BOOKED or CONFIRMED more than
# 2 hours after their end time are marked NO_SHOW.
hospital.no-show.enabled=true
hospital.no-show.cron=0 15 * * * *
hospital.no-show.grace-period=PT2H

# ---------------- Extension: OpenAPI / Swagger UI ----------------
# JSON document: /v3/api-docs     Browser UI: /swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
