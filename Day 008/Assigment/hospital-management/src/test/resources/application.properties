# =====================================================================
# Settings used ONLY by the tests (this file replaces the main
# application.properties on the test classpath).
#
# Integration tests use a SEPARATE database, hospital_day09_test, so they
# never touch the demo data in hospital_day09.
# =====================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/hospital_day09_test?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.config.import=optional:classpath:db-secret.properties

# The tests build their tables with the SAME Flyway migrations as production
# (db/migration only - no sample data). TestFlywayConfig wipes the test
# database first (Flyway "clean"), so every test run starts from an empty schema.
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

# Hibernate checks that the entities match the migrated tables.
# A wrong mapping fails the tests at startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.format.date=iso
spring.mvc.format.time=iso

# The scheduled NO_SHOW job is switched off: the tests call it directly with a fixed time.
hospital.no-show.enabled=false
hospital.no-show.grace-period=PT2H
