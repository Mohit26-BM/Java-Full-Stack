# =====================================================================
# Settings used ONLY by the tests (this file replaces the main
# application.properties on the test classpath).
#
# Integration tests use a SEPARATE database, hospital_management_test,
# so they never touch the demo data in hospital_management.
# =====================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/hospital_management_test?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.config.import=optional:classpath:db-secret.properties

# Hibernate creates the tables from the entities when the tests start
# and drops them when the tests finish.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Before creating the tables, create-drop first tries to drop the old foreign
# keys. On an empty test database those tables do not exist yet, which Hibernate
# reports as harmless WARN stack traces - hidden here.
logging.level.org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl=ERROR

spring.mvc.format.date=iso
spring.mvc.format.time=iso
