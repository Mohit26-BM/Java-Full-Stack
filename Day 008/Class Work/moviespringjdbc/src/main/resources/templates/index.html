<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Movie Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* Header */
        header {
            background: rgba(15, 23, 42, 0.9);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #f8fafc;
        }

        header h1::before {
            content: "🎬 ";
        }

        /* Main container */
        main {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        /* Sections */
        section {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        section h2 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #e2e8f0;
            border-left: 4px solid #8b5cf6;
            padding-left: 12px;
        }

        /* Forms */
        form {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        input {
            flex: 1;
            min-width: 180px;
            padding: 13px 15px;
            border: 1px solid #475569;
            border-radius: 9px;
            background: #0f172a;
            color: #f8fafc;
            font-size: 15px;
            outline: none;
            transition: 0.3s ease;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        /* Buttons */
        button {
            padding: 13px 22px;
            border: none;
            border-radius: 9px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        form button {
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
        }

        form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(124, 58, 237, 0.35);
        }

        /* Search button */
        section:nth-of-type(2) button {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
        }

        section:nth-of-type(2) button:hover {
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
        }

        /* Delete button */
        section:nth-of-type(3) button {
            background: linear-gradient(135deg, #dc2626, #ef4444);
        }

        section:nth-of-type(3) button:hover {
            box-shadow: 0 8px 18px rgba(220, 38, 38, 0.35);
        }

        /* Table */
        section:last-child {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            overflow: hidden;
            border-radius: 10px;
        }

        thead {
            background: linear-gradient(135deg, #4c1d95, #6d28d9);
        }

        th {
            padding: 16px;
            text-align: left;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        td {
            padding: 15px 16px;
            border-bottom: 1px solid #334155;
            color: #cbd5e1;
        }

        tbody tr {
            background: #1e293b;
            transition: 0.2s ease;
        }

        tbody tr:nth-child(even) {
            background: #172033;
        }

        tbody tr:hover {
            background: #2e3a52;
            transform: scale(1.005);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* Empty table message */
        td[colspan="4"] {
            text-align: center;
            padding: 30px;
            color: #94a3b8;
            font-style: italic;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 25px;
            }

            main {
                width: 94%;
                margin-top: 25px;
            }

            section {
                padding: 20px;
            }

            form {
                flex-direction: column;
                align-items: stretch;
            }

            input,
            button {
                width: 100%;
            }

            table {
                min-width: 650px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Movie Management System</h1>
</header>

<main>

    <!-- Add Movie -->
    <section>
        <h2>Add Movie</h2>

        <form action="/add" method="post">
            <input type="text" name="id" placeholder="Movie ID" required />

            <input type="text" name="name" placeholder="Movie Name" required />

            <input type="text" name="director" placeholder="Director" required />

            <input
                type="number"
                step="0.01"
                name="price"
                placeholder="Price"
                required
            />

            <button type="submit">Add Movie</button>
        </form>
    </section>

    <!-- Search Movie -->
    <section>
        <h2>Search Movie</h2>

        <form action="/search" method="get">
            <input
                type="text"
                name="name"
                placeholder="Enter movie name"
                required
            />

            <button type="submit">🔍 Search</button>
        </form>
    </section>

    <!-- Delete Movie -->
    <section>
        <h2>Delete Movie</h2>

        <form action="/delete" method="post">
            <input
                type="text"
                name="name"
                placeholder="Enter movie name"
                required
            />

            <button type="submit">🗑 Delete</button>
        </form>
    </section>

    <!-- Movies Table -->
    <section>
        <h2>Movies</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Director</th>
                    <th>Price</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="movie : ${movies}">
                    <td th:text="${movie.id}"></td>
                    <td th:text="${movie.name}"></td>
                    <td th:text="${movie.director}"></td>
                    <td th:text="${movie.price}"></td>
                </tr>

                <tr th:if="${#lists.isEmpty(movies)}">
                    <td colspan="4">
                        🎬 No movies found.
                    </td>
                </tr>

            </tbody>
        </table>
    </section>

</main>

</body>
</html>
