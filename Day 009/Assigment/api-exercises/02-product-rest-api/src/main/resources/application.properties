spring.application.name=product-rest-api
server.port=8080

# ---------------- Database ----------------
spring.datasource.url=jdbc:mysql://localhost:3306/product_store
spring.datasource.username=root
# The password is kept in db-secret.properties (git-ignored)
spring.config.import=optional:classpath:db-secret.properties

# The table comes from schema.sql; Hibernate only checks that it matches the entity
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Show the SQL that Hibernate sends to MySQL
logging.level.org.hibernate.SQL=DEBUG
