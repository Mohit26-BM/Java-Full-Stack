spring.application.name=secure-rest-api
server.port=8080

# ---------------- Database ----------------
spring.datasource.url=jdbc:mysql://localhost:3306/employee_portal
spring.datasource.username=root
# The DB password and the JWT secret are in secrets.properties (git-ignored)
spring.config.import=optional:classpath:secrets.properties

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------------- JWT ----------------
# Who issued the token (checked when a token comes back)
jwt.issuer=employee-portal
# Access token: sent with every API call, short-lived (15 minutes)
jwt.access-token-validity-seconds=900
# Refresh token: only used to get a new access token (24 hours)
jwt.refresh-token-validity-seconds=86400
# Tolerance for small clock differences between servers
jwt.clock-skew-seconds=30
