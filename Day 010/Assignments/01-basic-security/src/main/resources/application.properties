spring.application.name=basic-security
server.port=8080

# ---------------- Demo users (in memory) ----------------
# Only BCrypt HASHES are stored (cost 12). The application refuses to start if a
# value here is not a BCrypt hash (see PortalUsersProperties).
# Demo logins:  admin / Admin@123   (ADMIN, USER)     alice / Alice@123   (USER)
portal.users[0].username=admin
portal.users[0].password-hash=$2a$12$/chBMqeOICkLs9X0rSzJR.k7ZQCOaG7NkWsV2SKyMhjD969wnLB5O
portal.users[0].roles=ADMIN,USER

portal.users[1].username=alice
portal.users[1].password-hash=$2a$12$U6LtxMcU2vZQE.9339WA..L2kmSzgoYZrbwcqNG3AbrYiOWTYmNMm
portal.users[1].roles=USER

# Cost for NEW hashes (each +1 doubles the time). Existing hashes carry their own cost.
portal.bcrypt-strength=12

# ---------------- Logging ----------------
# DEBUG shows each request walking through the security filters
# ("Securing GET /api/employees", which chain matched, and why access was denied).
# Switch to INFO to quieten it.
logging.level.org.springframework.security=DEBUG
