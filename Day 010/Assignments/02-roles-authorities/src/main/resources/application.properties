spring.application.name=roles-authorities
server.port=8080

# ---------------- Demo users (in memory) ----------------
# roles       -> stored as ROLE_ADMIN, ROLE_HR ... (write them WITHOUT the prefix; the enum rejects ROLE_x)
# permissions -> stored as they are: EMPLOYEE_READ, EMPLOYEE_WRITE, EMPLOYEE_DELETE
# Only BCrypt hashes (cost 10). Passwords: see the README.

# admin / Admin@123 - everything
portal.users[0].username=admin
portal.users[0].password-hash=$2a$10$kOgeb4kHaday1Qka07YUTOX7g41dLUctpUZvxlQEo5mN/fXnpz.E.
portal.users[0].roles=ADMIN
portal.users[0].permissions=EMPLOYEE_READ,EMPLOYEE_WRITE,EMPLOYEE_DELETE
portal.users[0].employee-id=1

