spring.application.name=database-auth
server.port=8080

# ---------------- Database ----------------
# Its own database, created on the first start; Flyway then builds the tables.
spring.datasource.url=jdbc:mysql://localhost:3306/hr_auth_day10?createDatabaseIfNotExist=true
spring.datasource.username=root
# The password is kept in db-secret.properties (git-ignored)
spring.config.import=optional:classpath:db-secret.properties

# ---------------- Flyway ----------------
#   db/migration : V1 users/roles/permissions (+ the role and permission reference data), V2 reset tokens
#   db/sample    : V1_1 demo users
spring.flyway.locations=classpath:db/migration,classpath:db/sample

# ---------------- JPA ----------------
# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------------- Security settings ----------------
portal.security.bcrypt-strength=10
# 5 wrong passwords in a row lock the account for 15 minutes
portal.security.max-failed-attempts=5
portal.security.lock-duration=PT15M
portal.security.reset-token-validity=PT15M
# DEMO ONLY (there is no mail server): return the reset token in the response.
# Must be false in a real deployment, where the token is only e-mailed.
portal.security.return-reset-token=true

# ---------------- Logging ----------------
# Set to DEBUG to watch each login: "Authenticated user", "Failed to authenticate since password does not match"
logging.level.org.springframework.security=INFO
# Uncomment to see the SQL of each login (one query: users + roles + permissions)
#logging.level.org.hibernate.SQL=DEBUG
