# =====================================================================
# Settings used ONLY by the tests (this file replaces the main
# application.properties on the test classpath).
#
# The tests use a SEPARATE database, hr_auth_day10_test. TestFlywayConfig
# wipes it (Flyway "clean") and runs all migrations again at the start of
# every test run, so the tests always begin from the same known data.
# =====================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/hr_auth_day10_test?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.config.import=optional:classpath:db-secret.properties

# Same migrations as production, plus the demo users the tests log in with
spring.flyway.locations=classpath:db/migration,classpath:db/sample
spring.flyway.clean-disabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

portal.security.bcrypt-strength=10
portal.security.max-failed-attempts=5
portal.security.lock-duration=PT15M
portal.security.reset-token-validity=PT15M
portal.security.return-reset-token=true
