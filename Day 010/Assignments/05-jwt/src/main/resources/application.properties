spring.application.name=jwt-auth
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/hr_jwt_day10?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.config.import=optional:classpath:db-secret.properties,optional:classpath:jwt-secret.properties

spring.flyway.locations=classpath:db/migration,classpath:db/sample
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

portal.jwt.issuer=hr-portal
portal.jwt.access-token-ttl=PT15M
portal.jwt.refresh-token-ttl=P7D
portal.jwt.clock-skew=PT30S
portal.jwt.active-key-id=k2026-10

portal.bcrypt-strength=12

logging.level.org.springframework.security=INFO
