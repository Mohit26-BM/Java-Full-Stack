spring.application.name=security-tests
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/hr_tests_day10?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.config.import=optional:classpath:db-secret.properties,optional:classpath:jwt-secret.properties

spring.flyway.locations=classpath:db/migration,classpath:db/sample
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

portal.jwt.issuer=hr-portal
portal.jwt.access-token-ttl=PT15M

logging.pattern.level=%5p [%X{correlationId:-}]
logging.level.security.audit=INFO
