spring.application.name=account-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/account_service?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:mohit123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Shared HS256 signing secret (must be identical in customer-service and account-service)
app.jwt.secret=${JWT_SECRET:change-this-demo-secret-to-at-least-32-characters}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
