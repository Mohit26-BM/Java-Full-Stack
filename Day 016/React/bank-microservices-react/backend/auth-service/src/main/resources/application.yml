server:
  port: 9898
spring:
  application:
    name: AUTH-SERVICE
  config:
    # Local secrets (git-ignored). Optional, so containers can use environment variables instead.
    import: optional:file:../secrets.properties
  datasource:
    # All services share the Bank_Microservices database (separate tables). Override with DB_URL / DB_USERNAME / DB_PASSWORD.
    url: ${DB_URL:jdbc:mysql://localhost:3306/Bank_Microservices?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:bank_app}
    password: ${DB_PASSWORD:}
  flyway:
    table: flyway_auth_history   # one history table per service (they share one database)
    baseline-on-migrate: true
    baseline-version: 0          # so V1 still runs on a database that already has other services' tables
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches the entities
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
security:
  jwt:
    # Required (at least 32 characters). Set JWT_SECRET, or security.jwt.secret in secrets.properties. Must match the gateway.
    secret: ${JWT_SECRET:}
    expiration-ms: 3600000
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
