# Secrets come from a git-ignored .env file next to this file (copy .env.example). MySQL runs on the host PC.
# Only the gateway, auth service, Eureka dashboard and frontend are published; customer and account services are
# reachable only inside bank-network (they are no longer exposed on 8083 / 8082).
x-db: &db
  DB_URL: jdbc:mysql://host.docker.internal:3306/Bank_Microservices?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  DB_USERNAME: ${DB_USERNAME:-bank_app}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}

services:
  eureka-server:
    build:
      context: ./backend
      args:
        MODULE: eureka-server
    image: bank-eureka-server
    container_name: bank-eureka-server
    ports:
      - "8761:8761"
    networks:
      - bank-network

  auth-service:
    build:
      context: ./backend
      args:
        MODULE: auth-service
    image: bank-auth-service
    container_name: bank-auth-service
    environment:
      <<: *db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "9898:9898"
    networks:
      - bank-network
    depends_on:
      - eureka-server

  customer-service:
    build:
      context: ./backend
      args:
        MODULE: customer-service
    image: bank-customer-service
    container_name: bank-customer-service
    environment:
      <<: *db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - bank-network
    depends_on:
      - eureka-server

  account-service:
    build:
      context: ./backend
      args:
        MODULE: account-service
    image: bank-account-service
    container_name: bank-account-service
    environment:
      <<: *db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - bank-network
    depends_on:
      - eureka-server
      - customer-service

  api-gateway:
    build:
      context: ./backend
      args:
        MODULE: api-gateway
    image: bank-api-gateway
    container_name: bank-api-gateway
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8765:8765"
    networks:
      - bank-network
    depends_on:
      - eureka-server
      - auth-service
      - customer-service
      - account-service

  frontend:
    build:
      context: ./frontend
    image: bank-frontend
    container_name: bank-frontend
    ports:
      - "5173:80"
    networks:
      - bank-network
    depends_on:
      - api-gateway

networks:
  bank-network:
    driver: bridge
