<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CI/CD Demo Pipeline</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1c2333; --muted:#667085; --accent:#d33834; --line:#e4e7ee; --ok:#12a150; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1420; --card:#181f2f; --text:#e8ecf6; --muted:#97a1b8; --accent:#ff6b66; --line:#2a3348; --ok:#3ccf82; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:48px 16px 24px; text-align:center; }
  header h1 { margin:0 0 8px; font-size:2rem; }
  header p { margin:0; color:var(--muted); }
  main { max-width:820px; margin:0 auto; padding:0 16px 48px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  .card h2 { margin:0 0 12px; font-size:1rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .steps { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .step { padding:8px 14px; border-radius:999px; border:1px solid var(--line); font-size:.9rem; }
  .arrow { color:var(--muted); }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); }
  .dot.up { background:var(--ok); }
  .big { font-size:1.25rem; font-weight:600; word-break:break-all; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:560px) { .grid { grid-template-columns:1fr; } }
  .buttons { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input { font:inherit; padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); width:140px; }
  button { font:inherit; padding:10px 16px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); }
  button:hover { opacity:.9; }
  #reply { margin-top:16px; padding:14px; border-radius:8px; background:var(--bg); border:1px solid var(--line); min-height:48px; }
  footer { text-align:center; color:var(--muted); font-size:.85rem; padding-bottom:32px; }
</style>
</head>
<body>
<header>
  <h1>CI/CD Demo Pipeline</h1>
  <p>Built and deployed automatically by Jenkins</p>
</header>
<main>
  <section class="card">
    <h2>The pipeline</h2>
    <div class="steps">
      <span class="step">GitHub push</span><span class="arrow">&rarr;</span>
      <span class="step">Jenkins build</span><span class="arrow">&rarr;</span>
      <span class="step">Docker image</span><span class="arrow">&rarr;</span>
      <span class="step">Deploy</span>
    </div>
  </section>

  <div class="grid">
    <section class="card">
      <h2>Running version</h2>
      <div class="row"><span class="dot" id="dot"></span><span class="big" id="version">checking...</span></div>
    </section>
    <section class="card">
      <h2>Served by</h2>
      <div class="big" id="host">checking...</div>
    </section>
  </div>

  <section class="card">
    <h2>Call the API</h2>
    <div class="buttons">
      <button data-path="/hello">/hello</button>
      <button data-path="/welcome" class="ghost">/welcome</button>
      <input id="name" placeholder="your name" value="Mohit">
      <button id="greet" class="ghost">/greet</button>
    </div>
    <div id="reply">Press a button.</div>
  </section>
</main>
<footer>ci-cd-demo-pipeline &middot; Spring Boot, port 8080</footer>
<script>
  const $ = id => document.getElementById(id);

  async function loadInfo() {
    try {
      const info = await (await fetch('/api/info')).json();
      $('version').textContent = info.version === 'local' ? 'local run' : 'build #' + info.version;
      $('host').textContent = info.host;
      $('dot').classList.add('up');
    } catch (e) {
      $('version').textContent = 'backend not reachable';
    }
  }

  async function call(path) {
    $('reply').textContent = 'Loading...';
    try {
      $('reply').textContent = await (await fetch(path)).text();
    } catch (e) {
      $('reply').textContent = 'Request failed';
    }
  }

  document.querySelectorAll('button[data-path]').forEach(b => b.addEventListener('click', () => call(b.dataset.path)));
  $('greet').addEventListener('click', () => call('/greet?name=' + encodeURIComponent($('name').value)));

  loadInfo();
</script>
</body>
</html>
