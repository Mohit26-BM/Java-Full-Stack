<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kubernetes Demo App</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1c2333; --muted:#667085; --accent:#326ce5; --line:#e4e7ee; --ok:#12a150; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1420; --card:#181f2f; --text:#e8ecf6; --muted:#97a1b8; --accent:#6a9bff; --line:#2a3348; --ok:#3ccf82; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:48px 16px 32px; text-align:center; }
  header h1 { margin:0 0 8px; font-size:2rem; }
  header p { margin:0; color:var(--muted); }
  main { max-width:820px; margin:0 auto; padding:0 16px 48px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  .card h2 { margin:0 0 12px; font-size:1rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .pod { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); }
  .dot.up { background:var(--ok); }
  .pod strong { font-size:1.25rem; word-break:break-all; }
  .buttons { display:flex; gap:8px; flex-wrap:wrap; }
  button { font:inherit; padding:10px 16px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); }
  button:hover { opacity:.9; }
  #reply { margin-top:16px; padding:14px; border-radius:8px; background:var(--bg); border:1px solid var(--line); min-height:48px; }
  table { width:100%; border-collapse:collapse; font-size:.95rem; }
  td { padding:8px 0; border-bottom:1px solid var(--line); }
  td:first-child { color:var(--muted); width:40%; }
  tr:last-child td { border-bottom:none; }
  footer { text-align:center; color:var(--muted); font-size:.85rem; padding-bottom:32px; }
</style>
</head>
<body>
<header>
  <h1>Kubernetes Demo App</h1>
  <p>A Spring Boot app packaged in Docker and run on Kubernetes</p>
</header>
<main>
  <section class="card">
    <h2>Pod serving this page</h2>
    <div class="pod"><span class="dot" id="dot"></span><strong id="host">checking...</strong></div>
  </section>

  <section class="card">
    <h2>Call the API</h2>
    <div class="buttons">
      <button data-path="/hello">/hello</button>
      <button data-path="/welcome" class="ghost">/welcome</button>
      <button data-path="/bye" class="ghost">/bye</button>
    </div>
    <div id="reply">Press a button.</div>
  </section>

  <section class="card">
    <h2>This request</h2>
    <table>
      <tr><td>Address</td><td id="addr"></td></tr>
      <tr><td>Last response time</td><td id="ms">-</td></tr>
    </table>
  </section>
</main>
<footer>KubernetesDemoApp &middot; Spring Boot, port 8081</footer>
<script>
  const $ = id => document.getElementById(id);
  $('addr').textContent = location.origin;

  async function loadInfo() {
    try {
      const info = await (await fetch('/api/info')).json();
      $('host').textContent = info.host;
      $('dot').classList.add('up');
    } catch (e) {
      $('host').textContent = 'backend not reachable';
    }
  }

  document.querySelectorAll('button[data-path]').forEach(b => b.addEventListener('click', async () => {
    const start = performance.now();
    $('reply').textContent = 'Loading...';
    try {
      const res = await fetch(b.dataset.path);
      $('reply').textContent = await res.text();
    } catch (e) {
      $('reply').textContent = 'Request failed';
    }
    $('ms').textContent = Math.round(performance.now() - start) + ' ms';
  }));

  loadInfo();
</script>
</body>
</html>
