spring.application.name=product-catalog-testing
server.port=8080

# Shared Day 07 database (table a14_products). Password: db-secret.properties (git-ignored)
spring.datasource.url=jdbc:mysql://localhost:3306/Day_007_Assigments
spring.datasource.username=root
spring.config.import=optional:classpath:db-secret.properties

# ---------------- JPA / Hibernate ----------------
# validate = Hibernate CHECKS that the a14_products table matches the @Entity at startup,
# but never creates or changes tables (they come from schema.sql).
# Other values: none | update | create | create-drop  (dangerous on a shared database).
spring.jpa.hibernate.ddl-auto=validate

# Do not keep the DB session open during JSON rendering (also removes a startup warning)
spring.jpa.open-in-view=false

# ---------------- Show the GENERATED SQL ----------------
# Every statement Hibernate sends to MySQL ...
logging.level.org.hibernate.SQL=DEBUG
# ... and the values bound to its ? parameters
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ---------------- Pagination limits (optional extension) ----------------
spring.data.web.pageable.max-page-size=20

